name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  quality:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: appdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/appdb
      BIND_ADDR: 0.0.0.0:4000
      JWT_SECRET: dev-secret-change-me-at-least-32-chars
      JWT_EXPIRES_IN_SECS: 3600
      RUST_BACKTRACE: 1

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Coverage gate (shared-kernel ≥95%)
        run: |
          cargo install cargo-llvm-cov --locked 2>/dev/null || true
          cargo llvm-cov -p shared-kernel --fail-under-lines 95

  memory-check:
    runs-on: ubuntu-latest
    needs: quality
    if: github.event_name == 'pull_request'

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/appdb
      JWT_SECRET: dev-secret-change-me-at-least-32-chars

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@nightly

      - uses: Swatinem/rust-cache@v2

      - name: Memory leak check placeholder
        env:
          SKIP_MEMORY_CHECK: "1"
        run: bash scripts/check-memory-rs.sh

[package]
name = "web-leptos"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "web-leptos"
path = "src/main.rs"

[dependencies]
leptos = { version = "=0.7.8" }
leptos_axum = { version = "=0.7.8", optional = true }
leptos_meta = { version = "=0.7.8" }
leptos_router = { version = "=0.7.8" }
leptos_config = { version = "=0.7.8", optional = true }
axum = { version = "0.7", features = ["macros"], optional = true }
tokio = { workspace = true, optional = true }
tower = { version = "0.5", optional = true }
tower-http = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
reqwest = { version = "0.12", features = ["json"] }
tracing = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }
shared-kernel = { workspace = true }
async-trait = { workspace = true }
cfg-if = "1"
wasm-bindgen = { version = "=0.2.100", optional = true }
console_error_panic_hook = { version = "0.1", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "=0.3.77", features = ["Window", "Storage"] }

[features]
default = ["ssr"]
ssr = [
    "dep:axum",
    "dep:tokio",
    "dep:tower",
    "dep:tower-http",
    "dep:leptos_axum",
    "dep:leptos_config",
    "dep:tracing",
    "dep:tracing-subscriber",
    "leptos/ssr",
    "leptos_meta/ssr",
    "leptos_router/ssr",
]
hydrate = [
    "dep:wasm-bindgen",
    "dep:console_error_panic_hook",
    "leptos/hydrate",
]

[package.metadata.leptos]
output-name = "web-leptos"
site-root = "target/site"
site-pkg-dir = "pkg"
style-file = "style/output.css"
site-addr = "127.0.0.1:3000"
reload-port = 3001
env = "DEV"
bin-features = ["ssr"]
bin-default-features = false
lib-features = ["hydrate"]
lib-default-features = false
lib-profile-release = "wasm-release"
